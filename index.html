<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class></div>
    <div class="container">
        <h1>Akan Name</h1>
        <p>Find out your Ghananian name according to the day you were born.</p>

        <form id="akan-form">
            <div class="input-group">
                <label for="day">Day</label>
                <input type="number" id="day" placeholder="DD"required>
            </div>
            <div class="input-group">
                <label for="month">Month</label>
                <input type="number" id="month" placeholder="MM"required>
            </div>
            <div class="input-group">
                <label for="year">Year</label>
                <input type="number" id="year" placeholder="YY"required>
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select id="Gender" required>
                    <option value="">--Select Gender--</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <button type="submit">Get my Name</button>
             </form>
             <div id="results-section" class="hidden">
             <h3>My Akan Name is:</h3>
            <p id="display-name"></p>
            </div>
        </div>
        <script src="script.js"></script>
</body>
</html>
